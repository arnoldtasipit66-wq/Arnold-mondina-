<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHCLang Runner</title>
<style>
body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
input { width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; }
button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; background: #ff4444; color: white; }
#player { margin-top: 20px; width: 100%; height: 250px; border: none; }
#results { margin-top: 20px; text-align: left; max-height: 300px; overflow-y: auto; }
.song-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #333; }
.song-item:hover { background: #222; }
</style>
</head>
<body>
<input type="file" id="fileInput" accept=".phc">
<div id="app"></div>

<script>
let apikey = '', maxresults = 5;

document.getElementById('fileInput').onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  file.text().then(code => runPHC(code));
}

function runPHC(code) {
  const app = document.getElementById('app');
  const lines = code.split('\n');
  let html = '';

  lines.forEach(line => {
    const parts = line.trim().split(' ');
    const cmd = parts[0];
    if(!cmd || cmd.startsWith('#')) return;

    if(cmd === 'title') html += `<h1>${parts.slice(1).join(' ')}</h1>`;
    if(cmd === 'bgcolor') document.body.style.background = parts[1];
    if(cmd === 'textcolor') document.body.style.color = parts[1];
    if(cmd === 'searchbox') html += `<input id="searchQuery" placeholder="${parts.slice(2).join(' ')}">`;
    if(cmd === 'button') html += `<button onclick="searchVideos()">${parts.slice(1,3).join(' ')}</button>`;
    if(cmd === 'player') html += `<iframe id="player" src=""></iframe>`;
    if(cmd === 'apikey') apikey = parts[1];
    if(cmd === 'maxresults') maxresults = parts[1];
  });

  html += `<div id="results"></div>`;
  app.innerHTML = html;
}

async function searchVideos() {
  if(!apikey || apikey === 'YOUR_API_KEY_HERE') {
    alert('Lagay mo muna API key mo sa.phc file boss!');
    return;
  }

  const query = document.getElementById('searchQuery').value;
  if(!query) return;

  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=${maxresults}&q=${query}&key=${apikey}&type=video`;
  const res = await fetch(url);
  const data = await res.json();
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';

  data.items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'song-item';
    div.innerHTML = `<b>${item.snippet.title}</b><br><small>${item.snippet.channelTitle}</small>`;
    div.onclick = () => {
      document.getElementById('player').src = `https://www.youtube.com/embed/${item.id.videoId}?autoplay=1`;
    };
    resultsDiv.appendChild(div);
  });
}
</script>
</body>
</html>
